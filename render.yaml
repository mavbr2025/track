services:
  - type: web
    name: shipment-api
    runtime: docker
    plan: starter
    repo: https://github.com/mavbr2025/track
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: shipment-api
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: SHIPMENT_API_HOST
        value: 0.0.0.0
      - key: SHIPMENT_API_TRIGGER_TOKEN
        generateValue: true
      - key: SHIPMENT_PREFLIGHT_ENABLED
        value: "true"
      - key: SHIPMENT_MIN_SYNC_INTERVAL_HOURS
        value: "0"
      - key: CLICKUP_DISCOVER_LISTS_FROM_SPACES
        value: "true"
      - key: MSC_USE_PLAYWRIGHT
        value: "true"
      - key: MSC_PLAYWRIGHT_REQUIRED
        value: "true"
      - key: MSC_PLAYWRIGHT_BROWSER
        value: "chromium"
      - key: MSC_PLAYWRIGHT_CHANNEL
        value: "chrome"
      - key: MSC_PLAYWRIGHT_HEADLESS
        value: "true"
      - key: HAPAG_USE_PLAYWRIGHT
        value: "true"
      - key: HAPAG_PLAYWRIGHT_REQUIRED
        value: "false"
      - key: HAPAG_PLAYWRIGHT_BROWSER
        value: "chromium"
      - key: HAPAG_PLAYWRIGHT_CHANNEL
        value: "chrome"
      - key: HAPAG_PLAYWRIGHT_HEADLESS
        value: "true"
      - key: HAPAG_PLAYWRIGHT_VIEW
        value: "S8510"
      - key: HAPAG_PLAYWRIGHT_CHALLENGE_TIMEOUT_SECONDS
        value: "45"
      - key: HAPAG_PLAYWRIGHT_CHALLENGE_RELOAD_ATTEMPTS
        value: "2"
      - key: HAPAG_PLAYWRIGHT_WARMUP_SECONDS
        value: "6"
      - key: WAN_HAI_USE_PLAYWRIGHT
        value: "true"
      - key: WAN_HAI_PLAYWRIGHT_REQUIRED
        value: "false"
      - key: WAN_HAI_PLAYWRIGHT_BROWSER
        value: "chromium"
      - key: WAN_HAI_PLAYWRIGHT_CHANNEL
        value: "chrome"
      - key: WAN_HAI_PLAYWRIGHT_HEADLESS
        value: "true"

  - type: cron
    name: track-trace-cron
    runtime: docker
    plan: starter
    repo: https://github.com/mavbr2025/track
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    schedule: "0 */8 * * *"
    dockerCommand: ./scripts/run_sync.sh
    envVars:
      - key: SHIPMENT_PREFLIGHT_ENABLED
        value: "true"
      - key: SHIPMENT_MIN_SYNC_INTERVAL_HOURS
        value: "0"
      - key: CLICKUP_DISCOVER_LISTS_FROM_SPACES
        value: "true"
      - key: MSC_USE_PLAYWRIGHT
        value: "true"
      - key: MSC_PLAYWRIGHT_REQUIRED
        value: "true"
      - key: MSC_PLAYWRIGHT_BROWSER
        value: "chromium"
      - key: MSC_PLAYWRIGHT_CHANNEL
        value: "chrome"
      - key: MSC_PLAYWRIGHT_HEADLESS
        value: "true"
      - key: HAPAG_USE_PLAYWRIGHT
        value: "true"
      - key: HAPAG_PLAYWRIGHT_REQUIRED
        value: "false"
      - key: HAPAG_PLAYWRIGHT_BROWSER
        value: "chromium"
      - key: HAPAG_PLAYWRIGHT_CHANNEL
        value: "chrome"
      - key: HAPAG_PLAYWRIGHT_HEADLESS
        value: "true"
      - key: HAPAG_PLAYWRIGHT_VIEW
        value: "S8510"
      - key: HAPAG_PLAYWRIGHT_CHALLENGE_TIMEOUT_SECONDS
        value: "45"
      - key: HAPAG_PLAYWRIGHT_CHALLENGE_RELOAD_ATTEMPTS
        value: "2"
      - key: HAPAG_PLAYWRIGHT_WARMUP_SECONDS
        value: "6"
      - key: WAN_HAI_USE_PLAYWRIGHT
        value: "true"
      - key: WAN_HAI_PLAYWRIGHT_REQUIRED
        value: "false"
      - key: WAN_HAI_PLAYWRIGHT_BROWSER
        value: "chromium"
      - key: WAN_HAI_PLAYWRIGHT_CHANNEL
        value: "chrome"
      - key: WAN_HAI_PLAYWRIGHT_HEADLESS
        value: "true"
