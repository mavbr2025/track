x-track-trace-service: &track-trace-service
  dns:
    - 1.1.1.1
    - 8.8.8.8
  init: true

services:
  shipment-api:
    <<: *track-trace-service
    image: track-trace:latest
    container_name: shipment-api
    env_file:
      - ../../.env
    environment:
      SHIPMENT_API_HOST: "0.0.0.0"
      SHIPMENT_API_PORT: "10000"
      SHIPMENT_AUDIT_DB_PATH: "/data/shipment-sync/audit.sqlite3"
      SHIPMENT_AUDIT_SOURCE: "aws-api"
    volumes:
      - ../../data:/data/shipment-sync
    ports:
      - "127.0.0.1:10000:10000"
    command: shipment-api
    restart: unless-stopped

  track-trace-cron-maersk:
    # Maersk now runs as a dedicated ECS scheduled task. Keep this Lightsail
    # service opt-in only so a broad compose up does not create a duplicate worker.
    profiles: ["lightsail-maersk"]
    <<: *track-trace-service
    image: track-trace:latest
    container_name: track-trace-cron-maersk
    env_file:
      - ../../.env
    environment:
      PYTHONUNBUFFERED: "1"
      SHIPMENT_ALLOWED_LINES: "maersk"
      SHIPMENT_AUDIT_DB_PATH: "/data/shipment-sync/audit.sqlite3"
      SHIPMENT_AUDIT_SOURCE: "aws-cron-maersk"
      SHIPMENT_CRON_INTERVAL_SECONDS: "21600"
      SHIPMENT_RUN_TIMEOUT_SECONDS: "5400"
      SHIPMENT_PER_TASK_TIMEOUT_SECONDS: "180"
      SHIPMENT_PREFLIGHT_ENABLED: "false"
      CLICKUP_LIST_ID: "901703461634"
      CLICKUP_LIST_IDS: "901703461634,901703252746,169175872,901711638279,901706298710,901711807584,901709177285"
      CLICKUP_SPACE_IDS: "90171126576,90171139728"
      CLICKUP_DISCOVER_LISTS_FROM_SPACES: "true"
      CLICKUP_DISCOVER_LISTS_FROM_TEAM: "false"
      CLICKUP_DISCOVERY_VALIDATE_SCHEMA: "true"
      CLICKUP_DISCOVERY_LIST_NAME_INCLUDE: "shipment"
      CLICKUP_DISCOVERY_CACHE_PATH: "/data/shipment-sync/clickup-discovery-lists.json"
      CLICKUP_DISCOVERY_CACHE_TTL_SECONDS: "86400"
    volumes:
      - ../../data:/data/shipment-sync
    command: ./scripts/run_sync_loop.sh
    restart: unless-stopped

